name: Release crates (Cargo)

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      live-run:
        type: string
        required: true
      branch:
        type: string
        required: true
      unpublished-deps-patterns:
        type: string
        required: false
      unpublished-deps-repos:
        type: string
        required: false
      publication-test:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      repo:
        type: string
        required: true
      live-run:
        type: string
        required: true
      branch:
        type: string
        required: true
      unpublished-deps-patterns:
        type: string
        required: false
      unpublished-deps-repos:
        type: string
        required: false
      publication-test:
        type: boolean
        required: false
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build-essential (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libc6-dev

      - uses: eclipse-zenoh/ci/publish-crates-cargo@f139ca0eca68d7f87f452aecb489779c7e680fc5
        with:
          repo: ${{ inputs.repo }}
          live-run: ${{ inputs.live-run }}
          branch: ${{ inputs.branch }}
          unpublished-deps-patterns: ${{ inputs.unpublished-deps-patterns }}
          unpublished-deps-repos: ${{ inputs.unpublished-deps-repos }}
          github-token: ${{ secrets.BOT_TOKEN_WORKFLOW }}
          crates-io-token: ${{ secrets.CRATES_IO_TOKEN }}
          publication-test: ${{ inputs.publication-test }}
