name: Merge one release branch into main

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      repo:
        type: string
        required: true
      wait-for-merge:
        type: boolean
        default: false
    secrets:
      BOT_TOKEN_WORKFLOW:
        required: true

defaults:
  run:
    shell: bash

jobs:
  merge-release-branch:
    name: ${{ inputs.repo }} PR to merge release branch into main
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies for zenoh-dissector
        if: ${{ inputs.repo == 'eclipse-zenoh/zenoh-dissector' }}
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:wireshark-dev/stable-staging
          sudo apt install -y wireshark-dev wireshark
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Update git/branch in release branch
        if: ${{ !contains(fromJSON('["eclipse-zenoh/zenoh", "eclipse-zenoh/zenoh-pico", "eclipse-zenoh/zenoh-cpp", "eclipse-zenoh/zenoh-java", "eclipse-zenoh/zenoh-kotlin"]'), inputs.repo) }}
        uses: eclipse-zenoh/ci/set-git-branch@49a77d5353971f8a393ecee2b5d0666501844abc
        with:
          version: ${{ inputs.version }}
          release-branch: release/${{ inputs.version }}
          repo: ${{ inputs.repo }}
          github-token: ${{ secrets.BOT_TOKEN_WORKFLOW }}
          deps-pattern: |
            ^zenoh(?!-flat$).*
            ^zenoh-flat$
          deps-git-url: |
            https://github.com/eclipse-zenoh/zenoh.git
            https://github.com/eclipse-zenoh/zenoh-flat.git
          deps-branch: |
            main
            main

      - name: Checkout zenoh-c merge release branch
        if: ${{ inputs.repo == 'eclipse-zenoh/zenoh-c' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eclipse-zenoh/zenoh-c
          ref: eclipse-zenoh-bot/post-release-${{ inputs.version }}
          path: zenoh-c
          token: ${{ secrets.BOT_TOKEN_WORKFLOW }}
          fetch-depth: 0

      - name: Update zenoh-c Cargo.toml.in CMake template
        if: ${{ inputs.repo == 'eclipse-zenoh/zenoh-c' }}
        run: |
          cd zenoh-c
          if [[ -f "ci/scripts/sync-cargo-toml-in.bash" ]]; then
            echo "Running sync script for zenoh-c"
            bash ci/scripts/sync-cargo-toml-in.bash
            if ! git diff --exit-code Cargo.toml.in > /dev/null 2>&1; then
              git add Cargo.toml.in
              git commit --message "chore: Sync Cargo.toml.in with Cargo.toml"
              git push
            fi
          fi
        env:
          GIT_AUTHOR_NAME: eclipse-zenoh-bot
          GIT_AUTHOR_EMAIL: eclipse-zenoh-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: eclipse-zenoh-bot
          GIT_COMMITTER_EMAIL: eclipse-zenoh-bot@users.noreply.github.com

      - name: Compute branch
        id: compute-branch
        run: |
          if [[ "${{ inputs.repo }}" =~ ^eclipse-zenoh/zenoh(-cpp|-pico|-java|-kotlin)?$ ]] ; then
            echo "branch=release/${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "branch=eclipse-zenoh-bot/post-release-${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        id: cpr
        run: |
          output=$(gh pr create \
          --title "chore: Merge release/${{ inputs.version }} into main" \
          --body ":warning: This needs to be a merge commit :warning:" \
          --head ${{ steps.compute-branch.outputs.branch }} \
          --base main \
          --label internal \
          -R ${{ inputs.repo }} \
          2>&1) && exit_code=$? || exit_code=$?
          echo "Exit code: ${exit_code} Output: ${output}"
          if [[ ${exit_code} == 0 ]]; then
            echo "pull-request-operation=created" >> $GITHUB_OUTPUT
            pr_number="${output##*/pull/}"
            echo "pull-request-number=$pr_number" >> $GITHUB_OUTPUT
          else
            if [[ $output == *"No commits between"* ]]; then
                echo "pull-request-operation=none" >> $GITHUB_OUTPUT
                exit 0
            elif [[ $output == *"pull request for branch"* ]]; then
                echo "pull-request-operation=updated" >> $GITHUB_OUTPUT
                pr_number="${output##*/pull/}"
                echo "pull-request-number=$pr_number" >> $GITHUB_OUTPUT
                exit 0
            fi
            exit ${exit_code}
          fi
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN_WORKFLOW }}

      - name: Enable auto merge for the pull request
        if: ${{ contains(fromJSON('["created", "updated"]'), steps.cpr.outputs.pull-request-operation) }}
        run: >
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}"
          --subject "chore: Merge release/${{ inputs.version }} into main (#${{ steps.cpr.outputs.pull-request-number }})"
          --repo "${{ inputs.repo }}"
          --auto
          --merge
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN_WORKFLOW }}

      - name: Wait for pull request to be merged
        if: ${{ inputs.wait-for-merge && contains(fromJSON('["created", "updated"]'), steps.cpr.outputs.pull-request-operation) }}
        run: |
          for attempt in $(seq 1 360); do
            state=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --repo "${{ inputs.repo }}" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for PR to merge"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN_WORKFLOW }}

      - name: Add the PR as annotation to workflow run
        if: ${{ contains(fromJSON('["created", "updated"]'), steps.cpr.outputs.pull-request-operation) }}
        run: >
          echo "::notice:: PR ${{ steps.cpr.outputs.pull-request-operation }}: https://github.com/${{ inputs.repo }}/pull/${{ steps.cpr.outputs.pull-request-number }}"
