name: Merge release branch into main

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: The release branch version to merge into main
        required: true

  workflow_dispatch:
    inputs:
      version:
        type: string
        description: The release branch version to merge into main
        required: true

defaults:
  run:
    shell: bash

jobs:
  merge-zenoh:
    name: Merge zenoh release branch into main
    uses: ./.github/workflows/merge-release-branch-repo.yml
    with:
      version: ${{ inputs.version }}
      repo: eclipse-zenoh/zenoh
      wait-for-merge: true
    secrets: inherit

  merge-independent-release-branches:
    name: ${{ matrix.repo }} PR to merge release branch into main
    strategy:
      fail-fast: false
      matrix:
        repo:
          - eclipse-zenoh/zenoh-pico
          - eclipse-zenoh/zenoh-cpp
    uses: ./.github/workflows/merge-release-branch-repo.yml
    with:
      version: ${{ inputs.version }}
      repo: ${{ matrix.repo }}
    secrets: inherit

  merge-release-branch:
    name: ${{ matrix.repo }} PR to merge release branch into main
    needs: merge-zenoh
    strategy:
      fail-fast: false
      matrix:
        repo:
          - eclipse-zenoh/zenoh-c
          - eclipse-zenoh/zenoh-python
          - eclipse-zenoh/zenoh-java
          - eclipse-zenoh/zenoh-kotlin
          - eclipse-zenoh/zenoh-plugin-dds
          - eclipse-zenoh/zenoh-plugin-mqtt
          - eclipse-zenoh/zenoh-plugin-ros2dds
          - eclipse-zenoh/zenoh-plugin-webserver
          - eclipse-zenoh/zenoh-backend-filesystem
          - eclipse-zenoh/zenoh-backend-influxdb
          - eclipse-zenoh/zenoh-backend-rocksdb
          - eclipse-zenoh/zenoh-backend-s3
          - eclipse-zenoh/zenoh-ts
          - eclipse-zenoh/zenoh-dissector
    uses: ./.github/workflows/merge-release-branch-repo.yml
    with:
      version: ${{ inputs.version }}
      repo: ${{ matrix.repo }}
    secrets: inherit

  merge-zenoh-flat:
    name: Merge zenoh-flat release branch into main
    needs: merge-zenoh
    uses: ./.github/workflows/merge-release-branch-repo.yml
    with:
      version: ${{ inputs.version }}
      repo: eclipse-zenoh/zenoh-flat
      wait-for-merge: true
    secrets: inherit

  merge-zenoh-flat-jni:
    name: Merge zenoh-flat-jni release branch into main
    needs: merge-zenoh-flat
    uses: ./.github/workflows/merge-release-branch-repo.yml
    with:
      version: ${{ inputs.version }}
      repo: eclipse-zenoh/zenoh-flat-jni
    secrets: inherit
